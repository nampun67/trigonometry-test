<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>nampun ♡ jayjay</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;overflow-x:hidden;background:linear-gradient(135deg,#fff8fa,#ffe9ef);font-family:Arial,"Noto Sans Thai",sans-serif;color:#8d4057}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative}
.heart{position:relative;width:220px;height:220px;transform:rotate(-45deg) scale(0);background:#ff6f91;border-radius:18%;box-shadow:0 16px 40px rgba(190,70,105,.25);animation:pop .75s cubic-bezier(.17,1.45,.45,1) forwards,beat 1.55s ease-in-out .8s infinite}
.heart:before,.heart:after{content:"";position:absolute;width:100%;height:100%;background:#ff6f91;border-radius:50%}
.heart:before{top:-50%;left:0}.heart:after{top:0;left:50%}
.text{position:absolute;z-index:3;inset:0;display:flex;align-items:center;justify-content:center;transform:rotate(45deg);color:#fff;text-align:center;font-size:22px;font-weight:700;line-height:1.5;padding:25px;text-shadow:0 2px 7px rgba(120,30,55,.18)}
.spark{position:absolute;color:#fff;font-size:20px;opacity:.8;animation:float 2.5s ease-in-out infinite}
.a{top:20%;left:20%}.b{top:23%;right:20%;animation-delay:.6s}.c{bottom:20%;left:19%;animation-delay:1s}.d{bottom:19%;right:18%;animation-delay:1.5s}
.note{min-height:70vh;display:flex;align-items:flex-start;justify-content:center;text-align:center;padding:90px 28px 120px}
.note-inner{max-width:620px;font-size:21px;line-height:1.7;animation:fadein 1.2s ease both}
@keyframes pop{0%{transform:rotate(-45deg) scale(0)}70%{transform:rotate(-45deg) scale(1.08)}100%{transform:rotate(-45deg) scale(1)}}
@keyframes beat{0%,100%{transform:rotate(-45deg) scale(1)}50%{transform:rotate(-45deg) scale(1.055)}}
@keyframes float{50%{transform:translateY(-9px) scale(1.15)}}
@keyframes fadein{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<section class="hero">
<span class="spark a">✦</span><span class="spark b">♡</span><span class="spark c">✦</span><span class="spark d">♡</span>
<div class="heart"><div class="text">คืนดีกันคับ<br>เจเจ<br>น้ำปั่นคิดถึงเจเจคับ</div></div>
</section>
<section class="note">
<div class="note-inner">
I just want you to know that<br>
I wish I could go back<br>
and make everything better.
</div>
</section>
</body>
</html>
