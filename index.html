<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TRIG QUEST — Trigonometry Game</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080a16;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
body:before{content:"";position:fixed;inset:-30%;background:radial-gradient(circle at 75% 20%,#6548ff55,transparent 28%),radial-gradient(circle at 20% 80%,#247cff33,transparent 25%);pointer-events:none}
.app{width:min(680px,100%);position:relative}.box{background:#11152bfa;border:1px solid #ffffff16;border-radius:28px;padding:24px;box-shadow:0 25px 80px #0009}
.center{text-align:center}.eyebrow{font-size:12px;letter-spacing:2px;color:#aeb6da;font-weight:800}.logo{font-size:clamp(42px,11vw,68px);font-weight:950;letter-spacing:-4px;margin:8px 0}.muted{color:#aeb5d0;line-height:1.7}
button{font:inherit;font-weight:850;color:white;border:0;cursor:pointer}.start,.again{background:linear-gradient(135deg,#7658ff,#4c8dff);padding:16px 30px;border-radius:15px;box-shadow:0 12px 30px #6655ff3b;margin-top:18px}
.hide{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{padding:9px 12px;border-radius:12px;background:#ffffff0c;border:1px solid #ffffff10;font-size:14px}.hearts{font-size:21px;letter-spacing:2px}
.track{height:7px;background:#292e4a;border-radius:10px;margin:18px 0 20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#7358ff,#62a1ff);transition:width .25s}
.time{text-align:center;color:#aeb5d0;font-size:13px;font-weight:800}.time span{color:white}.question{font-size:clamp(22px,5.5vw,32px);font-weight:900;text-align:center;line-height:1.35;margin:25px 0}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.answer{min-height:76px;padding:15px;border-radius:17px;background:#202645;border:1px solid #41486f;transition:.15s}.answer:hover{transform:translateY(-2px);background:#29305a}.correct{background:#164b39!important;border-color:#45e0a0!important}.wrong{background:#572537!important;border-color:#ff7087!important}
.feedback{text-align:center;height:26px;margin-top:15px;font-weight:800}.result h2{font-size:42px;margin:10px 0}.score{font-size:30px;font-weight:950;margin:15px}.stat{color:#b9c0db}
@media(max-width:520px){.answers{grid-template-columns:1fr}.box{padding:19px}.question{margin:21px 0}.answer{min-height:64px}}
</style>
</head>
<body>
<main class="app"><div class="box">
<section id="home" class="center">
<div class="eyebrow">MATHEMATICS • TRIGONOMETRY</div><div class="logo">TRIG QUEST</div>
<p class="muted">15 questions · 60 seconds each · 3 hearts<br>Choose the correct answer and survive the quest.</p>
<button class="start" onclick="start()">START GAME</button>
</section>

<section id="game" class="hide">
<div class="top"><div class="badge" id="num">Question 1 / 15</div><div class="hearts" id="heart">❤️❤️❤️</div></div>
<div class="track"><div class="fill" id="fill"></div></div>
<div class="time">TIME LEFT: <span id="clock">60</span>s</div>
<div class="question" id="q"></div>
<div class="answers"><button class="answer" id="b0" onclick="answer(0)"></button><button class="answer" id="b1" onclick="answer(1)"></button></div>
<div class="feedback" id="fb"></div>
</section>

<section id="end" class="center hide">
<div class="eyebrow">TRIG QUEST</div><h2 id="title"></h2><div class="score" id="score"></div><p class="stat" id="desc"></p>
<button class="again" onclick="start()">PLAY AGAIN</button>
</section>
</div></main>

<script>
const data=[
["If sin θ = 3/5 and θ is acute, what is cos θ?","4/5","3/5",0],
["What is tan 45°?","1","√3",0],
["What is sin 30°?","1/2","√3/2",0],
["What is cos 60°?","1/2","√3/2",0],
["If tan θ = 1, what is θ?","45°","30°",0],
["What is sin 90°?","1","0",0],
["What is cos 0°?","0","1",1],
["Which identity is correct?","sin²θ + cos²θ = 1","sin²θ − cos²θ = 1",0],
["What is tan 30°?","1/√3","√3",0],
["Opposite = 6 and adjacent = 8. What is tan θ?","3/4","4/3",0],
["What is sin 45°?","√2/2","1/2",0],
["What is cos 45°?","√2/2","√3/2",0],
["Hypotenuse = 10 and opposite = 6. What is sin θ?","3/5","4/5",0],
["What is tan 60°?","√3","1/√3",0],
["If cos θ = 12/13, what is sin θ for acute θ?","5/13","12/13",0]
];
let i=0,h=3,s=0,t=60,interval=null,locked=false;
const $=id=>document.getElementById(id);
function start(){i=0;h=3;s=0;$("home").classList.add("hide");$("end").classList.add("hide");$("game").classList.remove("hide");load()}
function load(){locked=false;t=60;let x=data[i];$("num").textContent=`Question ${i+1} / 15`;$("heart").textContent="❤️".repeat(h)+"🖤".repeat(3-h);$("fill").style.width=((i+1)/15*100)+"%";$("q").textContent=x[0];$("b0").textContent=x[1];$("b1").textContent=x[2];$("b0").className="answer";$("b1").className="answer";$("fb").textContent="";$("clock").textContent=t;clearInterval(interval);interval=setInterval(()=>{t--;$("clock").textContent=t;if(t<=0)answer(-1)},1000)}
function answer(c){if(locked)return;locked=true;clearInterval(interval);let correct=data[i][3];if(c===correct){s++;$("b"+correct).classList.add("correct");$("fb").textContent="Correct! ✨"}else{h--;$("heart").textContent="❤️".repeat(h)+"🖤".repeat(3-h);if(c>=0)$("b"+c).classList.add("wrong");$("b"+correct).classList.add("correct");$("fb").textContent=c===-1?"Time's up!":"Not quite!"}
if(h<=0){setTimeout(()=>finish(false),650);return}if(i===14){setTimeout(()=>finish(true),650);return}setTimeout(()=>{i++;load()},600)}
function finish(win){$("game").classList.add("hide");$("end").classList.remove("hide");$("title").textContent=win?"YOU WIN! 🎉":"YOU LOSE 💔";$("score").textContent=`Score: ${s} / 15`;$("desc").textContent=win?`You finished all 15 questions with ${h} heart${h===1?"":"s"} remaining.`:"You ran out of hearts. Try again and beat your score!"}
</script>
</body></html>
